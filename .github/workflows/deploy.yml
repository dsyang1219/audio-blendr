name: Deploy

# Publishes to Cloudflare Workers on every push to main, after CI-equivalent
# checks pass. Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN  — "Edit Cloudflare Workers" template token
#   CLOUDFLARE_ACCOUNT_ID — from the Workers & Pages overview page
# and two repository variables (public, inlined into the client bundle):
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY
# Server-side secrets (Spotify, YouTube, service role) are set once on the
# Worker with `wrangler secret put` and are not touched by this workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: |
          bun run typecheck
          bun run lint
          bun run test

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
